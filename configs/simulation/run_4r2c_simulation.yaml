paths:
  processed_root: "data/processed/training_data"
  output_root: "data/processed/sim_results"

selection:
  city: "Denver"
  house_name: "58103"

# Path to the identified 4R2C parameter file. This file is written by the
# sysid workflow (run_sysid_ekf) alongside sysid_summary.json and contains
# the 8 physical parameters that describe the model.
model:
  path: "data/processed/sysid_results/Denver/58103/model.json"

# Where the input drivers come from.
#   source: "processed" -> reads processed_5min.csv for the selection above.
#   source: "custom"    -> reads the CSV at `custom_path` (same schema as
#                          processed_5min.csv; must include T_zone_C for
#                          one_step / n_step comparisons).
inputs:
  source: "processed"
  custom_path: null

# Simulation window. The workflow slices the input CSV to
# [start, start + duration_hours) and requires `history_hours` of data
# immediately before `start` for wall temperature initialization.
window:
  start: "2018-08-02T00:00:05"
  duration_hours: 48

# Hours of prior data used to compute mean(T_oa) and mean(T_in) for
# initializing wall temperatures.
history_hours: 6.0

# Wall initialization: convex combination of history means.
#   T_iw(0) = alpha_iw * mean(T_oa_history) + (1 - alpha_iw) * mean(T_in_history)
#   T_ow(0) = alpha_ow * mean(T_oa_history) + (1 - alpha_ow) * mean(T_in_history)
# Values in [0, 1] keep walls between the two means. Values outside that
# range extrapolate past the endpoints.
#
# Optional. If this section is omitted, the workflow uses `init_alpha_iw`
# and `init_alpha_ow` from model.json (written by the sysid workflow).
# Include this section to override those identified defaults.
# wall_init:
#   alpha_iw: 0.2   # inner wall closer to indoor air
#   alpha_ow: 0.7   # outer wall closer to outdoor air

# Prediction mode.
#   kind: "simulation" -> open-loop rollout from the initial state.
#   kind: "one_step"   -> reset T_in to measurement each step, predict T_in[k+1].
#   kind: "n_step"     -> reset T_in to measurement each step, predict T_in[k+n].
# n_steps_ahead is required only when kind == "n_step".
mode:
  kind: "n_step"
  n_steps_ahead: 12   # 1 hour ahead at 5-min data
